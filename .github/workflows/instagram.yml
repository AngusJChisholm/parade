name: Instagram autopilot

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["instagram/queue/**", "instagram/CHECK"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan = normal run, render = force re-render today's images, dedupe-check = list repeat posts, dedupe-delete = delete repeat posts (keeps the first of each)"
        default: plan
        type: choice
        options: [plan, render, dedupe-check, dedupe-delete, delete-today, post-now]
      post_date:
        description: "post-now only: post a missed day's queue (YYYY-MM-DD). Leave blank for today."
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_FEED: ${{ inputs.action == 'post-now' && '1' || '' }}
      # post-now with a post_date runs plan/render/post as if it were that day at 7:05pm
      IG_NOW: ${{ inputs.action == 'post-now' && inputs.post_date != '' && format('{0}T19:05', inputs.post_date) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The runner's default Python moved to 3.14, which Playwright 1.48's greenlet can't build on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clean up repeat posts
        if: startsWith(inputs.action, 'dedupe')
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: python3 tools/instagram_post.py dedupe ${{ inputs.action == 'dedupe-delete' && 'delete' || 'check' }}

      - name: Delete today's post
        if: inputs.action == 'delete-today'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: python3 tools/instagram_post.py delete-today

      - name: What's due
        id: plan
        if: ${{ !startsWith(inputs.action, 'dedupe') && inputs.action != 'delete-today' }}
        run: python3 tools/instagram_post.py plan

      - name: Install renderer
        if: steps.plan.outputs.render == 'true' || inputs.action == 'render' || inputs.action == 'post-now'
        run: |
          pip install playwright==1.48.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - name: Render today's images
        if: steps.plan.outputs.render == 'true' || inputs.action == 'render' || inputs.action == 'post-now'
        run: python3 tools/instagram_post.py render

      - name: Post to Instagram
        if: steps.plan.outputs.post == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "Instagram secrets not set yet - skipping posting"; exit 0
          fi
          python3 tools/instagram_post.py post

      - name: Daily stats
        if: steps.plan.outputs.stats == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then exit 0; fi
          IG_NOW= python3 tools/instagram_post.py stats || echo "Stats failed - posting unaffected"

      - name: Connection check
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ig-check]')
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
        run: python3 tools/instagram_post.py check
