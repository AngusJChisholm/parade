<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Partnership deck</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
@font-face{font-family:"ArchivoV";src:url("assets/fonts/Archivo[wdth,wght].ttf") format("truetype");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--volt:#D2FF3C;--ink:#111;--ink-3:#5C5C57;--line:#DEDED8;--canvas:#F4F4F1}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"ArchivoV","Archivo","Helvetica Neue",Arial,sans-serif}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.gb{width:100%;max-width:440px}
.gb .k{font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.gb h1{font-stretch:68%;font-weight:800;text-transform:uppercase;font-size:clamp(40px,7vw,72px);line-height:.9;margin:12px 0 10px}
.gb p{color:var(--ink-3);line-height:1.5;margin:0 0 20px}
.gb form{display:flex;flex-direction:column;gap:10px}
.gb input{font:inherit;font-size:16px;padding:14px 16px;border:2px solid var(--ink);border-radius:0}
.gb input:focus{outline:none;box-shadow:inset 0 -3px 0 var(--volt)}
.gb button{font:inherit;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:#fff;border:0;padding:15px 18px;cursor:pointer}
.gb button:hover{background:var(--volt);color:#000}
.err{color:#B00020;font-weight:800;font-size:13px;min-height:18px;margin-top:10px}
.view{display:none;min-height:100vh;flex-direction:column}
.view.on{display:flex}
.bar{display:flex;align-items:center;gap:12px;padding:12px clamp(12px,3vw,32px);border-bottom:1px solid var(--line)}
.bar b{font-stretch:68%;font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:-.005em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar span{font-weight:800;font-size:12px;letter-spacing:.12em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar button{font:inherit;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;background:#fff;border:1px solid var(--ink);padding:9px 12px;cursor:pointer}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:clamp(8px,2vw,28px);background:var(--canvas)}
.slide{position:relative;width:min(100%,calc((100vh - 150px)*16/9));aspect-ratio:16/9;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.12)}
.slide img,.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.dots{display:flex;gap:4px;justify-content:center;padding:12px;flex-wrap:wrap}
.dots i{width:28px;height:5px;background:var(--line);cursor:pointer}
.dots i.on{background:var(--ink)}
.ft{text-align:center;font-size:11px;color:var(--ink-3);padding:0 0 14px}
</style>
</head>
<body>
<section class="gate" id="gate"><div class="gb">
<span class="k" id="gK">Partnership deck</span>
<h1 id="gT">Loading…</h1>
<p id="gP"></p>
<form id="gF" hidden autocomplete="on">
<input id="gEm" type="email" placeholder="Your work email" autocomplete="email" hidden>
<input id="gC" type="text" inputmode="numeric" placeholder="Code from your email" autocomplete="one-time-code" maxlength="10" hidden>
<input id="gPw" type="password" placeholder="Password" autocomplete="current-password" hidden>
<button type="submit" id="gB">Open</button>
</form>
<div class="err" id="gE" role="alert"></div>
</div></section>
<section class="view" id="view">
<div class="bar"><b id="vT"></b><span id="vN"></span><button type="button" id="vPrev" aria-label="Previous slide">←</button><button type="button" id="vNext" aria-label="Next slide">→</button></div>
<div class="stage"><div class="slide" id="vS"></div></div>
<div class="dots" id="vD"></div>
<div class="ft">Use the arrow keys to move through the deck.</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/pro-config.js?v=1"></script>
<script src="assets/deck-view.js?v=1"></script>
</body>
</html>
